name: Update current month

on:
  schedule:
    - cron: '33 7 1 * *' # want to avoid peak usage
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump the current-month category link
        run: node scripts/update_month_category.mjs

      - name: Commit and push if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add profile/README.md
            git commit -m "$(date -u +%B | tr 'A-Z' 'a-z')"
            git push
          fi
